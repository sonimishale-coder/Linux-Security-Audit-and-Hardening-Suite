
# Linux Security Audit Suite Configuration

# General Settings
LOG_FILE="logs/security_audit.log"
REPORT_DIR="reports"

# Security Policies
MIN_PASSWORD_LENGTH=8
MAX_PASSWORD_DAYS=90
WARN_UID_ZERO=true

# SSH Security
DISABLE_ROOT_LOGIN=true

# File Permission Policies
CHECK_WORLD_WRITABLE=true
CHECK_SENSITIVE_PERMISSIONS=true

# Network Security
CHECK_OPEN_PORTS=true

# Remediation Settings
ENABLE_REMEDIATION=false
CREATE_BACKUP=true

# Scan Profiles
DEFAULT_PROFILE="standard"

# File Search Exclusions
EXCLUDE_DIRS="/proc /sys /dev /run"
REMEDIATE_WORLD_WRITABLE=false
REMEDIATE_SENSITIVE_PERMISSIONS=true
